# Flash Next basic PD topology from the model guide, section 5.2.
test_cases:
  - name: Qwen3.8-Flash-Next-w4a8-PD-Decode-A3
    model: &model Eco-Tech/Qwen3.8-Flash-Next-w4a8
    service_mode: pd
    # Allow the decode engine to compile the main model and MTP graphs on a cold runner.
    pd_startup_timeout: 10800
    special_dependencies:
      fastokens: "0.3.5"
    envs:
      VLLM_USE_MODELSCOPE: "true"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "10800"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "3000"
    pd_server_envs:
      - HCCL_NPU_SOCKET_PORT_RANGE: "61400-61499"
        HCCL_BUFFSIZE: "8192"
        VLLM_USE_FASTOKENS: "1"
      - HCCL_NPU_SOCKET_PORT_RANGE: "61500-61599"
        HCCL_BUFFSIZE: "512"
    pd_server_cmds:
      # Prefill
      - - *model
        - --host
        - "0.0.0.0"
        - --port
        - $PREFILL_PORT
        - --served-model-name
        - *model
        - --trust-remote-code
        - --quantization
        - ascend
        - --tensor-parallel-size
        - "2"
        - --pipeline-parallel-size
        - "4"
        - --data-parallel-size
        - "1"
        - --max-model-len
        - "143360"
        - --max-num-seqs
        - "32"
        - --max-num-batched-tokens
        - "8192"
        - --gpu-memory-utilization
        - "0.90"
        - --enable-prefix-caching
        - --async-scheduling
        - --enable-expert-parallel
        - --mamba-cache-mode
        - align
        - --mamba-ssm-cache-dtype
        - bfloat16
        - --engram-config
        - '{"cpu_offload":true,"dp_shared_memory":false}'
        - --enforce-eager
        - --additional-config
        - >-
          {"enable_shared_expert_dp": true,
           "enable_flashcomm1": true,
           "enable_prefill_mc2": true,
           "enable_fused_mc2": 0,
           "enable_cpu_binding": true,
           "multistream_overlap_shared_expert": true,
           "ascend_compilation_config": {"fuse_norm_quant":false}}
        - --speculative-config
        - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":true}'
        - --kv-transfer-config
        - >-
          {"kv_connector": "MooncakeConnectorV2",
           "kv_role": "kv_producer",
           "kv_port": 32600,
           "kv_connector_extra_config": {"prefill":{"dp_size":1,"tp_size":2,"pp_size":4},"decode":{"dp_size":4,"tp_size":2}}}
      # Decode
      - - *model
        - --host
        - "0.0.0.0"
        - --port
        - $DECODE_PORT
        - --served-model-name
        - *model
        - --trust-remote-code
        - --enable-force-include-usage
        - --quantization
        - ascend
        - --tensor-parallel-size
        - "2"
        - --data-parallel-size
        - "4"
        - --max-model-len
        - "143360"
        - --max-num-seqs
        - "32"
        - --max-num-batched-tokens
        - "8192"
        - --gpu-memory-utilization
        - "0.90"
        - --enable-prefix-caching
        - --async-scheduling
        - --enable-expert-parallel
        - --mamba-cache-mode
        - align
        - --mamba-ssm-cache-dtype
        - bfloat16
        - --engram-config
        - '{"cpu_offload":true,"dp_shared_memory":true}'
        - --compilation-config
        - '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,4,8,12,16,32,40,44,48,64,96,128]}'
        - --additional-config
        - >-
          {"enable_flashcomm1": true,
           "enable_cpu_binding": true,
           "enable_shared_expert_dp": true,
           "multistream_overlap_shared_expert": true,
           "scheduler_config": {"recompute_scheduler_enable":true},
           "ascend_compilation_config": {"fuse_norm_quant":false,"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":true}}
        - --speculative-config
        - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"enforce_eager":false}'
        - --kv-transfer-config
        - >-
          {"kv_connector": "MooncakeConnectorV2",
           "kv_role": "kv_consumer",
           "kv_port": 32700,
           "kv_connector_extra_config": {"prefill":{"dp_size":1,"tp_size":2,"pp_size":4},"decode":{"dp_size":4,"tp_size":2}}}
    test_content: []
    benchmarks:
      prepare_decode_prompts:
        case_type: curl_cmd
        cmds:
          - python -m tests.e2e.nightly.scripts.prepare_qwen38_pd_prompts decode
      warmup_d_128k: &warmup_d_128k
        case_type: performance
        dataset_path_local: qwen38_a3_decode/128k
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 16
        batch_size: 16
        max_out_len: 1
        request_rate: 0
      pure_d_128k: &pure_d_128k
        <<: *warmup_d_128k
        num_prompts: 512
        batch_size: 128
        max_out_len: 1024
      warmup_d_128k_round_2: *warmup_d_128k
      pure_d_128k_round_2: *pure_d_128k
      warmup_d_128k_round_3: *warmup_d_128k
      pure_d_128k_round_3: *pure_d_128k
      warmup_d_16k: &warmup_d_16k
        case_type: performance
        dataset_path_local: qwen38_a3_decode/16k
        request_conf: vllm_api_stream_chat
        dataset_conf: gsm8k/gsm8k_gen_0_shot_cot_str_perf
        num_prompts: 16
        batch_size: 16
        max_out_len: 1
        request_rate: 0
      pure_d_16k: &pure_d_16k
        <<: *warmup_d_16k
        num_prompts: 176
        batch_size: 44
        max_out_len: 1024
      warmup_d_16k_round_2: *warmup_d_16k
      pure_d_16k_round_2: *pure_d_16k
      warmup_d_16k_round_3: *warmup_d_16k
      pure_d_16k_round_3: *pure_d_16k
